version: '3.9'

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: tyre
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - '8000:8000'
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/.env:/app/.env:ro

  frontend:
    image: node:20
    restart: "no"
    working_dir: /app
    command: sh -c "npm install && npm run build && rm -rf /app/dist-public/* && cp -R /app/dist/tyre-frontend/browser/. /app/dist-public/"
    volumes:
      - ./frontend/tyre-frontend:/app
      - frontend_dist:/app/dist-public

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro

volumes:
  postgres_data:
  frontend_dist:
